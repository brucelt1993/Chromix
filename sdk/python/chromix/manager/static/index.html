<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromix 管理器</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--line:#e3e6eb;--text:#1d2129;--muted:#6b7280;
  --accent:#2f6fed;--accent-ink:#fff;--ok:#12805c;--ok-bg:#e3f5ec;--warn:#a15c00;--warn-bg:#fff2dc;
  --danger:#c62f2f;--danger-bg:#fdecec;--chip:#eef1f5;--shadow:0 8px 28px rgba(15,23,42,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111418;--panel:#1a1e24;--line:#2b313a;--text:#e6e9ee;--muted:#9aa3af;
  --accent:#5b8dff;--ok:#4cc38a;--ok-bg:#163527;--warn:#f0b35a;--warn-bg:#3a2b13;
  --danger:#ff6b6b;--danger-bg:#3b1c1c;--chip:#242a32;--shadow:0 8px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:17px;margin:0;font-weight:650}
.sub{color:var(--muted);font-size:12px}
main{padding:20px 24px;max-width:1400px;margin:0 auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar input{flex:1 1 220px;max-width:320px}
.stats{display:flex;gap:16px;color:var(--muted);font-size:13px;margin-left:auto}
.stats b{color:var(--text);font-variant-numeric:tabular-nums}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--danger)}
button.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
button.sm{padding:3px 9px;font-size:12.5px}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px;width:100%}
textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.table-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:920px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
.name{font-weight:600}
.chip{display:inline-block;background:var(--chip);border-radius:5px;padding:0 6px;font-size:12px;margin:1px 3px 1px 0}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.running{color:var(--ok);background:var(--ok-bg)}
.pill.stopped{color:var(--muted);background:var(--chip)}
.pill.busy{color:var(--warn);background:var(--warn-bg)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}
.actions{display:flex;flex-wrap:wrap;gap:5px}
.muted{color:var(--muted)}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end;z-index:10}
.drawer{width:min(560px,100%);height:100%;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer header{position:static}
.drawer .body{padding:18px 22px;overflow:auto;flex:1}
.drawer footer{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.check{display:flex;align-items:center;gap:7px;color:var(--text);font-size:13.5px}
.check input{width:auto}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.error{background:var(--danger-bg);color:var(--danger);border-radius:8px;padding:8px 12px;margin-bottom:12px;white-space:pre-wrap;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:20;max-width:90vw}
.cookie-list{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin:10px 0}
.cookie-list div{padding:5px 10px;border-bottom:1px solid var(--line);font-size:12.5px;display:flex;justify-content:space-between;gap:8px}
.cookie-list div:last-child{border-bottom:0}
pre.log{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11.5px;white-space:pre-wrap;word-break:break-all;max-height:70vh;overflow:auto}
@media (max-width:640px){header,main{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr}.stats{margin-left:0}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Chromix 管理器</h1>
    <div class="sub" id="home">每个 profile 拥有独立用户目录、独立指纹种子和独立 CDP 端口</div>
  </div>
  <div class="actions">
    <button id="stopAll">全部停止</button>
    <button class="primary" id="newBtn">新建 profile</button>
  </div>
</header>
<main>
  <div id="tokenBox" hidden class="toolbar">
    <input id="tokenInput" type="password" placeholder="输入访问 token">
    <button class="primary" id="tokenSave">连接</button>
  </div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="搜索名称、分组、备注">
    <div class="stats"><span>共 <b id="statTotal">0</b></span><span>运行中 <b id="statRun">0</b></span></div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Profile</th><th>指纹</th><th>代理</th><th>状态</th><th>CDP 端点</th><th>操作</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>还没有 profile。点击「新建 profile」，可直接选用「Boss直聘」模板。</div>
  </div>
</main>
<div id="layer"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PLATFORM = {"": "本机", windows: "Windows", macos: "macOS", linux: "Linux"};
let profiles = [], info = null, token = "";
try { token = localStorage.getItem("chromix-token") || ""; } catch {}

async function call(method, path, body) {
  const headers = {};
  if (token) headers["X-Chromix-Token"] = token;
  if (method !== "GET") headers["Content-Type"] = "application/json";
  const res = await fetch(path, {method, headers, body: method === "GET" ? undefined : JSON.stringify(body || {})});
  const data = await res.json().catch(() => ({error: `HTTP ${res.status}`}));
  if (res.status === 401) { $("#tokenBox").hidden = false; }
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("已复制"); }
  catch { toast(text); }
}

// 危险操作两次点击确认：第一次变红，3 秒内再点才执行。
function armed(btn, run) {
  if (btn.classList.contains("armed")) { btn.classList.remove("armed"); return run(); }
  const old = btn.textContent;
  btn.classList.add("armed"); btn.textContent = "确认？";
  setTimeout(() => { btn.classList.remove("armed"); btn.textContent = old; }, 3000);
}

async function refresh() {
  try {
    profiles = await call("GET", "/api/profiles");
    render();
  } catch (e) { if (!$("#tokenBox").hidden) return; toast(e.message); }
}

function render() {
  const q = $("#search").value.trim().toLowerCase();
  const list = profiles.filter(p => !q || [p.name, p.group, p.notes].join(" ").toLowerCase().includes(q));
  $("#statTotal").textContent = profiles.length;
  $("#statRun").textContent = profiles.filter(p => p.status.state === "running").length;
  $("#empty").hidden = profiles.length > 0;
  $("#rows").innerHTML = list.map(p => {
    const s = p.status, run = s.state === "running", busy = s.state === "busy";
    const fp = [PLATFORM[p.platform], p.locale, p.timezone].filter(Boolean).map(v => `<span class="chip">${esc(v)}</span>`).join("")
      + `<div class="muted mono">seed ${p.seed ?? "首次启动生成"}</div>`;
    const proxy = p.proxy ? `<span class="mono">${esc(p.proxy.replace(/\/\/[^@/]*@/, "//***@"))}</span>${p.geoip ? '<div><span class="chip">GeoIP</span></div>' : ""}` : '<span class="muted">直连</span>';
    const endpoint = run
      ? `<div class="mono">${esc(s.cdp_http)}</div><div class="actions" style="margin-top:4px">
           <button class="sm" data-copy="${esc(s.cdp_http)}">复制 HTTP</button>
           <button class="sm" data-copy="${esc(s.cdp_ws)}">复制 WS</button>
           <button class="sm" data-copy="${esc(s.cdp_remote)}" title="外部程序经管理器端口连接，需带 token">复制网关</button></div>`
      : `<span class="muted">${p.cdp_port ? "固定端口 " + p.cdp_port : "启动后自动分配"}</span>`;
    return `<tr data-id="${p.id}">
      <td><div class="name">${esc(p.name)}</div>
        ${p.group ? `<span class="chip">${esc(p.group)}</span>` : ""}${p.headless ? '<span class="chip">无头</span>' : ""}
        ${p.notes ? `<div class="muted">${esc(p.notes)}</div>` : ""}
        <div class="muted mono">#${p.id}</div></td>
      <td>${fp}</td>
      <td>${proxy}</td>
      <td><span class="pill ${s.state}">${run ? "运行中" : busy ? "处理中" : "已停止"}</span>
        ${run ? `<div class="muted mono">pid ${s.pid}</div>` : ""}</td>
      <td>${endpoint}</td>
      <td><div class="actions">
        ${run ? `<button class="sm" data-act="stop">停止</button>` : `<button class="sm primary" data-act="start" ${busy ? "disabled" : ""}>启动</button>`}
        <button class="sm" data-act="edit">编辑</button>
        <button class="sm" data-act="cookies" ${run ? "" : 'disabled title="需先启动"'}>Cookie</button>
        <button class="sm" data-act="log">日志</button>
        <button class="sm danger" data-act="delete" ${run || busy ? "disabled" : ""}>删除</button>
      </div></td></tr>`;
  }).join("");
}

$("#rows").addEventListener("click", async ev => {
  const btn = ev.target.closest("button"); if (!btn) return;
  if (btn.dataset.copy) return copy(btn.dataset.copy);
  const id = btn.closest("tr").dataset.id, p = profiles.find(x => x.id === id), act = btn.dataset.act;
  try {
    if (act === "start" || act === "stop") {
      btn.disabled = true; btn.textContent = act === "start" ? "启动中…" : "停止中…";
      await call("POST", `/api/profiles/${id}/${act}`);
    } else if (act === "edit") return openEditor(p);
    else if (act === "cookies") return openCookies(p);
    else if (act === "log") return openLog(p);
    else if (act === "delete") return armed(btn, async () => {
      await call("DELETE", `/api/profiles/${id}`); toast("已删除，用户目录已清理"); refresh();
    });
  } catch (e) { alertBox(e.message); }
  refresh();
});

function drawer(title, body, footer) {
  $("#layer").innerHTML = `<div class="overlay"><div class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header><h1>${esc(title)}</h1><button data-close>关闭</button></header>
    <div class="body">${body}</div>${footer ? `<footer>${footer}</footer>` : ""}</div></div>`;
  const ov = $(".overlay");
  ov.addEventListener("click", e => { if (e.target === ov || e.target.hasAttribute("data-close")) close(); });
  return ov;
}
function close() { $("#layer").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

function alertBox(msg) {
  drawer("操作失败", `<div class="error">${esc(msg)}</div>`);
}

function openEditor(p) {
  const isNew = !p;
  p = p || {name: "", group: "", notes: "", platform: "", locale: "", timezone: "", proxy: "", geoip: false,
            headless: false, start_url: "", cdp_port: 0, args: []};
  const tpl = isNew ? `<div class="full"><label>模板</label><select name="template">
      <option value="">空白</option><option value="boss">Boss直聘（zh-CN / Asia/Shanghai / 打开 zhipin.com）</option></select>
      <div class="hint">每个 profile 都是独立用户目录，各自登录 Boss 直聘互不影响。</div></div>` : "";
  const ov = drawer(isNew ? "新建 profile" : `编辑 ${p.name}`, `
    <div id="formErr"></div>
    <form class="grid" id="form" autocomplete="off">
      ${tpl}
      <div><label>名称 *</label><input name="name" required maxlength="64" value="${esc(p.name)}"></div>
      <div><label>分组</label><input name="group" value="${esc(p.group)}"></div>
      <div class="full"><label>备注</label><input name="notes" value="${esc(p.notes)}"></div>
      <div><label>平台人设</label><select name="platform">${Object.entries(PLATFORM).map(([k, v]) =>
        `<option value="${k}" ${p.platform === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
      <div><label>语言 locale</label><input name="locale" placeholder="zh-CN" value="${esc(p.locale)}"></div>
      <div><label>时区</label><input name="timezone" placeholder="Asia/Shanghai" value="${esc(p.timezone)}"></div>
      <div><label>CDP 端口</label><input name="cdp_port" type="number" min="0" max="65535" value="${p.cdp_port}">
        <div class="hint">0 = 自动分配</div></div>
      <div class="full"><label>代理</label><input name="proxy" placeholder="http://user:pass@host:port 或 socks5://host:port" value="${esc(p.proxy)}">
        <div class="hint">HTTP 代理账号由本地中继注入；带账号的 SOCKS5 需对应补丁版本的浏览器。</div></div>
      <div class="full"><label>启动页</label><input name="start_url" placeholder="https://www.zhipin.com/" value="${esc(p.start_url)}"></div>
      <div class="full"><label>附加启动参数（每行一个）</label><textarea name="args" rows="3" placeholder="--fingerprint-hardware-concurrency=8">${esc(p.args.join("\n"))}</textarea></div>
      <div><label class="check"><input type="checkbox" name="geoip" ${p.geoip ? "checked" : ""}> 按出口 IP 推导语言/时区</label></div>
      <div><label class="check"><input type="checkbox" name="headless" ${p.headless ? "checked" : ""}> 无头模式</label></div>
    </form>`, `<button data-close>取消</button><button class="primary" id="save">保存</button>`);
  const form = $("#form", ov);
  if (isNew) form.template.addEventListener("change", () => {
    const t = info?.templates?.[form.template.value] || {};
    for (const [k, v] of Object.entries(t)) if (form[k] && !form[k].value) form[k].value = v;
  });
  $("#save", ov).addEventListener("click", async () => {
    const f = form;
    if (!f.reportValidity()) return;
    const data = {name: f.name.value, group: f.group.value, notes: f.notes.value, platform: f.platform.value,
      locale: f.locale.value, timezone: f.timezone.value, proxy: f.proxy.value, start_url: f.start_url.value,
      cdp_port: Number(f.cdp_port.value || 0), geoip: f.geoip.checked, headless: f.headless.checked,
      args: f.args.value.split("\n").map(s => s.trim()).filter(Boolean)};
    if (isNew) data.template = f.template.value;
    try {
      await call(isNew ? "POST" : "PUT", isNew ? "/api/profiles" : `/api/profiles/${p.id}`, data);
      close(); toast(isNew ? "已创建" : "已保存，下次启动生效"); refresh();
    } catch (e) { $("#formErr").innerHTML = `<div class="error">${esc(e.message)}</div>`; }
  });
}

function openCookies(p) {
  const ov = drawer(`Cookie · ${p.name}`, `
    <div class="grid"><div class="full"><label>域名（含子域）</label>
      <div class="actions" style="flex-wrap:nowrap"><input id="cDomain" value="zhipin.com"><button id="cLoad">查询</button></div>
      <div class="hint">留空查询全部。只操作当前 profile，其他 profile 的登录态不受影响。</div></div></div>
    <div id="cErr"></div><div class="cookie-list" id="cList"><div class="muted">加载中…</div></div>
    <div class="actions">
      <button id="cExport">导出 JSON</button>
      <button class="danger" id="cDelete">清除该域 Cookie（退出登录）</button>
    </div>
    <label style="margin-top:16px">导入 Cookie（粘贴导出的 JSON 数组）</label>
    <textarea id="cJson" rows="7"></textarea>
    <div class="actions" style="margin-top:8px"><button id="cImport" class="primary">导入</button></div>`);
  const domain = () => $("#cDomain", ov).value.trim();
  let current = [];
  const load = async () => {
    try {
      current = (await call("GET", `/api/profiles/${p.id}/cookies?domain=${encodeURIComponent(domain())}`)).cookies;
      $("#cErr", ov).innerHTML = "";
      $("#cList", ov).innerHTML = current.length ? current.map(c =>
        `<div><span class="mono">${esc(c.name)}</span><span class="muted">${esc(c.domain)}${c.session ? " · 会话" : ""}</span></div>`).join("")
        : '<div class="muted">没有 Cookie</div>';
    } catch (e) { $("#cErr", ov).innerHTML = `<div class="error">${esc(e.message)}</div>`; }
  };
  $("#cLoad", ov).addEventListener("click", load);
  $("#cExport", ov).addEventListener("click", () => { $("#cJson", ov).value = JSON.stringify(current, null, 2); copy($("#cJson", ov).value); });
  $("#cDelete", ov).addEventListener("click", ev => {
    if (!domain()) return toast("请先填写域名");
    armed(ev.target, async () => {
      try { const r = await call("DELETE", `/api/profiles/${p.id}/cookies?domain=${encodeURIComponent(domain())}`);
        toast(`已删除 ${r.deleted} 条`); load(); }
      catch (e) { $("#cErr", ov).innerHTML = `<div class="error">${esc(e.message)}</div>`; }
    });
  });
  $("#cImport", ov).addEventListener("click", async () => {
    try {
      const cookies = JSON.parse($("#cJson", ov).value || "[]");
      const r = await call("POST", `/api/profiles/${p.id}/cookies`, {cookies});
      toast(`已导入 ${r.imported} 条`); load();
    } catch (e) { $("#cErr", ov).innerHTML = `<div class="error">${esc(e.message)}</div>`; }
  });
  load();
}

async function openLog(p) {
  const ov = drawer(`日志 · ${p.name}`, `<pre class="log" id="logBody">加载中…</pre>`);
  try { const r = await call("GET", `/api/profiles/${p.id}/log`); $("#logBody", ov).textContent = r.log || "（暂无日志）";
    const el = $("#logBody", ov); el.scrollTop = el.scrollHeight; }
  catch (e) { $("#logBody", ov).textContent = e.message; }
}

$("#newBtn").addEventListener("click", () => openEditor(null));
$("#search").addEventListener("input", render);
$("#stopAll").addEventListener("click", ev => armed(ev.target, async () => {
  try { await call("POST", "/api/stop-all"); toast("已全部停止"); } catch (e) { alertBox(e.message); }
  refresh();
}));
$("#tokenSave").addEventListener("click", () => {
  token = $("#tokenInput").value.trim();
  try { localStorage.setItem("chromix-token", token); } catch {}
  $("#tokenBox").hidden = true; boot();
});

async function boot() {
  try {
    info = await call("GET", "/api/info");
    $("#home").textContent = `数据目录 ${info.home} · 每个 profile 独立用户目录 / 指纹种子 / CDP 端口`;
  } catch (e) { return; }
  refresh();
}
boot();
setInterval(() => { if (!$(".overlay")) refresh(); }, 3000);
</script>
</body>
</html>
